services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.47.2-jammy

        RUN apt-get update \
          && apt-get install -y --no-install-recommends ca-certificates wget gpg \
          && install -d -m 0755 /etc/apt/keyrings \
          && wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg \
          && echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb jammy main" > /etc/apt/sources.list.d/adoptium.list \
          && apt-get update \
          && apt-get install -y --no-install-recommends temurin-21-jdk \
          && rm -rf /var/lib/apt/lists/*

        WORKDIR /Users/hyem/assignment-grader
        COPY package.json package-lock.json ./
        COPY backend/package.json backend/package.json
        COPY frontend/package.json frontend/package.json
        RUN npm ci
    working_dir: /Users/hyem/assignment-grader
    command: sh -lc "mkdir -p .tmp backend/uploads && npm run dev"
    environment:
      PORT: "4000"
      TMPDIR: /Users/hyem/assignment-grader/.tmp
      VITE_BACKEND_URL: http://localhost:4000
      VITE_HMR_CLIENT_PORT: "80"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    expose:
      - "4000"
      - "5173"
    volumes:
      - ./backend/src:/Users/hyem/assignment-grader/backend/src
      - ./backend/uploads:/Users/hyem/assignment-grader/backend/uploads
      - ./.tmp:/Users/hyem/assignment-grader/.tmp
      - ./frontend/src:/Users/hyem/assignment-grader/frontend/src
      - ./frontend/index.html:/Users/hyem/assignment-grader/frontend/index.html
      - ./frontend/vite.config.ts:/Users/hyem/assignment-grader/frontend/vite.config.ts
      - ./frontend/tailwind.config.js:/Users/hyem/assignment-grader/frontend/tailwind.config.js
      - ./frontend/postcss.config.js:/Users/hyem/assignment-grader/frontend/postcss.config.js

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
